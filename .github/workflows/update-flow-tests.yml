name: Update Flow Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-flow-tests:
    name: Update Flow Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run update-focused tests
        run: >-
          pnpm -s vitest run
          src/test/updateFlow.integration.test.tsx
          src/test/SimpleUpdateManager.test.tsx
          src/hooks/useUpdater.test.ts
          src/test/updateSettings.test.ts
